<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mi Perfil</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 50px; background-color: #eef2f3; text-align: center; }
    .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
    h1 { color: #2c3e50; }
    .logout { margin-top: 20px; display: inline-block; padding: 10px 15px; background: #e74c3c; color: white; text-decoration: none; border-radius: 4px; }
    .logout:hover { background: #c0392b; }
  </style>
</head>
<body>

<div class="card">
  <h1>¡Bienvenido a tu Zona Privada! 🎉</h1>
  <p>Hola, <strong th:text="${usuario}" style="color: #2980b9; font-size: 20px;">Usuario</strong>. Has iniciado sesión correctamente.</p>

  <br>
  <!-- Botón para volver al login -->
  <a href="login-page" class="logout">Cerrar Sesión</a>
</div>

</body>
</html>
