<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login de Acceso</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Iniciar Sesión 🔑</h2>
    <!-- Apunta al servlet que procesa el POST -->
    <form action="login" method="POST">
        <div class="input-group">
            <label>Usuario:</label>
            <input type="text" name="usuario" placeholder="Ej: admin" required>
        </div>
        <div class="input-group">
            <label>Contraseña:</label>
            <input type="password" name="password" placeholder="Ej: 1234" required>
        </div>
        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
